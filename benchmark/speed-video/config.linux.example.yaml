# Benchmark config for the Linux comparisons C1 (Parula JMAP vs Parula IMAP) and C2 (Parula JMAP vs Thunderbird IMAP),
# one interleaved session on one Linux computer (README: "Linux tests: run here"). Copy to config.yaml and fill in
# the placeholders (<…>). Relative paths are relative to this file. The password comes only from the environment
# (export BENCH_PASSWORD=…) or from `bench.py --password-prompt …`; it is never written anywhere.

workdir: ./work                     # corpus cache, address-owner cache, compose output
results_dir: ./results              # result folders results-linux-<yyyymmdd-hhmm>/ (+ .zip), several GB each

tools:
  ffmpeg: ffmpeg                    # ffmpeg >= 7 with x11grab, libx264, libvpx-vp9, libopus, drawtext, loudnorm
  ffprobe: ffprobe
  xdotool: xdotool
  Xvfb: Xvfb                        # only with display.xvfb
  ss: ss                            # iproute2; byte counters per connection for the network evidence

server:                             # account mode: an existing server, one test account, nothing else is touched
  software: Stalwart                 # the server software as the method texts name it; version optional (below)
  # version: "0.16.26"              # a user account can't ask the server for its version: set it for the report
  host: <mail.example.org>          # JMAP https://<host>/.well-known/jmap, IMAP <host>:993, SMTP <host>:465 unless set:
  # jmap_session_url: https://<host>/.well-known/jmap
  # imap: {host: <host>, port: 993, tls: true}
  # smtp: {host: <host>, port: 465}

account:
  email: <bench@example.org>        # a dedicated test account: seeding refuses an account with other mail
  display_name: Robin Sample
  password_env: BENCH_PASSWORD

corpus:
  profile: inbox-30k                # 30,000 messages in the Inbox, 300 of them with one 1,000,000-byte attachment
  seed: 20261018
  owner_name: Robin Sample
  owner_address: robin.sample@example.com

display:
  platform: linux
  xvfb: true                        # run-linux starts its own Xvfb (2560x1440); false: use `display` (an X11 session)
  screen: 2560x1440
  display: ":0"
  layout: 2560x1440
  app_region: {x: 0, y: 0, width: 1280, height: 940}   # 2 panes of this size + the bands fill 2560x1440
  marker: {cell: 12, position: below, gap: 4}   # sync marker strip just outside the app region (cropped later)
  masks: []

capture:
  fps: 60
  cpus: "11"                        # ffmpeg pinned to this core (taskset); keep the apps off it if you can
  draw_mouse: false                 # the pointer is parked outside the capture after each click and not recorded
  live_scale: 4
  tail_s: 0                         # scenarios set their own (T1: 30 s after the list is complete)

settle:
  pixel_threshold: 8
  min_changed_pixels: 150
  quiet_s: 1.0                      # a step ends at the last change before this much stillness
  probe_interval_s: 1.0             # the completeness probe is asked at most this often, only while the screen is quiet
  moving_content_hz: 10             # how often the probe reports content that changes by itself (Parula's setup video)
  step_timeout_s: 7200
  task_timeout_s: 7200              # time limit per task; a run that reaches it counts as "not done within the limit"
  no_reaction_s: 60
  max_gap_frames: 3

evidence:
  network: true                     # network.jsonl per run (connections of each app's process tree, 10 Hz)
  poll_hz: 10
  task: T1

runs: {measured: 5, warmup: 1, retries: 2, analyze_after_each: true, max_cpu_pressure_pct: 15}

driver:
  type_delay_ms: 40                 # the same typing speed for every app

apps:
  parula-jmap: &parula
    name: Parula
    protocol: JMAP
    os: Linux
    # The official .deb of the current release, unpacked without root: bench.py fetch-parula --dir tools/parula.
    # --remote-debugging-port: the instrumentation (DevTools) that finds the setup's elements and checks the Inbox.
    # In a container without user namespaces, GPU and a large /dev/shm add: --no-sandbox --disable-gpu
    # --disable-dev-shm-usage (listed as deviations below).
    launch: ["{config_dir}/tools/parula/root/opt/Parula/parula", --remote-debugging-port=29222]
    env: {HOME: "{profile}/home", XDG_CACHE_HOME: "{home}/.cache", LANG: en_US.UTF-8}
    create_dirs: ["{profile}/home"]
    profile:
      dirs: ["{profile}/home"]
      links:
        "{profile}/home/.config/gtk-3.0": "{home}/.config/gtk-3.0"
        "{profile}/home/.config/fontconfig": "{home}/.config/fontconfig"
    probe: {type: cdp, port: 29222, timeout_s: 120}
    window: {class: "[Pp]arula", timeout_s: 120}
    close: {key: ctrl+q, timeout_s: 30}
    process_names: ["opt/Parula/parula"]
    process_env: {HOME: "{profile}/home"}   # only the benchmark profile's processes, never your own Parula
    version_from: {asar: "{config_dir}/tools/parula/root/opt/Parula/resources/app.asar"}
  parula-imap:
    <<: *parula
    protocol: IMAP
  thunderbird:
    name: Thunderbird
    protocol: IMAP
    os: Linux
    # -marionette -remote-allow-system-access: the instrumentation (Marionette) that finds the Account Hub's elements
    # and checks the Inbox; marionette.port in user.js.
    launch: ["{config_dir}/tools/thunderbird/thunderbird", -profile, "{profile}/tb", -no-remote, -marionette,
             -remote-allow-system-access]
    env: {LANG: en_US.UTF-8, MOZ_CRASHREPORTER_DISABLE: "1"}
    profile:
      dirs: ["{profile}/tb"]
      files:
        "{profile}/tb/user.js": |
          user_pref("app.update.auto", false);
          user_pref("app.update.checkInstallTime", false);
          user_pref("mail.shell.checkDefaultClient", false);
          user_pref("toolkit.telemetry.reportingpolicy.firstRun", false);
          user_pref("datareporting.policy.dataSubmissionPolicyBypassNotification", true);
          user_pref("mail.rights.override", true);
          user_pref("app.donation.eoy.version.viewed", 999);
          user_pref("mail.inappnotifications.enabled", false);
          user_pref("mailnews.start_page.enabled", false);
          user_pref("marionette.port", 28828);
          user_pref("widget.gtk.overlay-scrollbars.enabled", false);
    probe: {type: marionette, port: 28828, timeout_s: 120}
    window: {class: "thunderbird", timeout_s: 120}
    close: {key: ctrl+q, timeout_s: 60}
    process_names: ["{profile}/tb"]
    version_from: {ini: "{config_dir}/tools/thunderbird/application.ini"}

sessions:                           # one interleaved series per computer (A B C A B C …); C1 and C2 use the same
  linux: {apps: [parula-jmap, parula-imap, thunderbird]}    # Parula JMAP runs, so the combined cut shows one median

comparisons:
  C1: {os: Linux, left: parula-jmap, right: parula-imap, tasks: [T1], session: linux}
  C2: {os: Linux, left: parula-jmap, right: thunderbird, tasks: [T1], session: linux}

deviations:
  - "Thunderbird: start page switched off (mailnews.start_page.enabled = false), so no web page loads during the measurement."
  - "Thunderbird: user.js also switches off pop-ups that would appear during capture: update checks, the default-client question, the telemetry and rights notices, donation and in-app notifications. Install-wide app updates disabled with distribution/policies.json (DisableAppUpdate)."
  - "Thunderbird: started with Marionette (-marionette -remote-allow-system-access) for the instrumentation."
  - "Thunderbird: classic scrollbars instead of GTK overlay scrollbars (widget.gtk.overlay-scrollbars.enabled = false), as Parula shows them: an overlay scrollbar fades in and out whenever the window is inspected, which would keep the screen from settling."
  - "Parula: installed from the .deb package; started with --remote-debugging-port for the instrumentation."
  - "Parula: its setup pages play a background video, which kept playing as every user sees it (it streams from www.mustang.im during the setup). Where it is visible (the video minus the setup dialog, read from Parula's page ten times a second) was left out of the screen-change detection, during the run and in the analysis of the recording; the setup dialog and everything after the setup counted in full."

instrumentation:
  - "The apps' own instrumentation (Parula: Chrome DevTools Protocol; Thunderbird: Marionette) finds the setup's buttons and fields, so the driver can click and type there like a user (xdotool). It never gives a time."
  - "During Parula's setup its DevTools also report, ten times a second, where the setup's background video is visible (see deviations)."
  - "Every measured step ends at the last screen change in the recording before the moment the instrumentation confirmed the step's result (the next setup page; in the last step: the Inbox lists all messages). The instrumentation is asked only while the screen is still, about once per second."
  - "After the measured end the instrumentation checks completeness: the folder's message count equals the corpus and the corpus's oldest message is in the list (scrolled to). A run that fails this check counts as a wrong result."
  - "Client-side network evidence: the TCP connections of each app's processes are read from /proc ten times a second."

procedures:
  - "Neither app keeps the password in the desktop keyring: Parula stores it encrypted in its own profile, Thunderbird in its profile's logins.json; both profiles are new in every run."

publish:
  page_url: <https://parula.app/…>
  method_url: https://parula.app    # the YouTube text's link to the full method text (all deviations)
  repo_url: https://github.com/mustang-im/mustang/tree/master/benchmark/speed-video
  imprint_url: <https://parula.app/…>

compose:
  font_regular: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
  font_bold: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
  voice_dir: ./voice
  min_hold_s: 2.0
  race_budget_s: 30

speech:                             # bench.py voice: text-to-speech for the chosen lines (see benchlib/speech.py)
  en:
    engine: command
    name: Piper
    command: [piper, --model, "{model}", --output_file, "{out}"]
    model: ./voices/en_US-norman-medium.onnx
    # model_sha256: <pin it>
    voice: en_US-norman-medium
    license: "Piper voice trained on public-domain LibriVox recordings"
    lexicon: {JMAP: Jay-Map, IMAP: Eye-Map}
  de:
    engine: google
    voice: de-DE-Chirp3-HD-Orus
    language_code: de-DE
    api_key_env: GOOGLE_TTS_API_KEY
    lexicon: {JMAP: Jay-Map, IMAP: Eye-Map}

encode:
  loudness_lufs: -14
  true_peak_db: -1
  webm_crf: 30
  mp4_crf: 18
  youtube_crf: 12
  youtube_height: 2160
