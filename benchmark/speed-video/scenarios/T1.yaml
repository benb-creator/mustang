# New account: from the first "continue"-type action of the app's own account setup until the Inbox lists all
# messages of the corpus (profile inbox-30k: 30,000) and the list has settled. Typing is not waiting time: each
# step's timer starts at its last action (the "continue"-type key or click) and runs until the screen settles.
#
# "All listed" is checked, not assumed (an Inbox shows its first page long before the rest of the list is loaded).
# Every app's setup is a `flow` that finds the setup's elements through the app's instrumentation (no calibration);
# the probe's completeness check opens the live gate during a quiet screen, the measured end comes from the
# recording, and after it the probe verifies that all messages are listed and the oldest is reachable (README,
# "Instrumentation").
id: T1
title: {en: "New account: Inbox lists all messages", de: "Neues Konto: Posteingang listet alle Mails"}
description: "Fresh app profile and the seeded server state; from the first continue of the account setup until the Inbox lists all messages and has settled"
start_state: {server: seeded, client: fresh}
timeout_s: 7200
apps:
  # The account setup is found programmatically (`flow`, benchlib/flows.py): the app's probe (Parula: DevTools,
  # Thunderbird: Marionette, the Outlooks: UI Automation) tells which page is shown and where its elements are; the
  # driver clicks and types there like a user. The last step ends when the screen is quiet and the probe confirms that the Inbox lists
  # all messages (`final.complete`); after the measured end the probe checks that the oldest message is reachable
  # (`final.verify`). Every input of the flow is a counted user action except the "prepare" ones (disclosed).
  parula-jmap:
    prepare: [launch]                 # its setup pages play a video: the probe reports its area, which isn't counted
    tail_s: 30
    flow: {name: parula-setup, protocol: jmap,
           final: {complete: inbox_listed, verify: true, after_end: fail, first_visible: true}}
  parula-imap:
    prepare: [launch]
    tail_s: 30
    flow: {name: parula-setup, protocol: imap,
           final: {complete: inbox_listed, verify: true, after_end: fail, first_visible: true}}
  thunderbird:
    prepare: [launch, {wait_settled: {quiet_s: 2.0, timeout_s: 120}}]
    tail_s: 30
    flow: {name: thunderbird-setup,
           final: {complete: inbox_listed, verify: true, after_end: fail, first_visible: true}}
  # Windows apps (the session of windows/run-windows-tests.ps1): Parula is the same app with the same flow and
  # probe as on Linux (parula-jmap above). Outlook (classic) and new Outlook are found with UI Automation (probe
  # `uia`, element names in windows/uia-elements.yaml, English and German).
  outlook-classic:
    prepare: [launch, {wait_settled: {quiet_s: 3.0, timeout_s: 180}}]
    tail_s: 30
    flow: {name: outlook-classic-setup,
           final: {complete: inbox_listed, verify: true, after_end: fail, first_visible: true}}
  outlook-new:
    # After the measured end the account stays until new Outlook has listed every message for a few minutes,
    # then it is removed with "Remove from all devices" (benchlib/winsession.py NewOutlookLifecycle); if that
    # fails, the series stops, because the next run would not start as a new account setup.
    prepare: [launch, {wait_settled: {quiet_s: 3.0, timeout_s: 180}}]
    tail_s: 30
    finish_required: true
    flow: {name: outlook-new-setup,
           final: {complete: inbox_listed, verify: true, after_end: fail, first_visible: true}}
