# New account: from the first "continue"-type action of the app's own account setup until the Inbox lists all
# messages of the corpus (profile inbox-30k: 30,000) and the list has settled. Typing is not waiting time: each
# step's timer starts at its last action (the "continue"-type key or click) and runs until the screen settles.
#
# "All listed" is checked, not assumed (an Inbox shows its first page long before the rest of the list is loaded):
# - regions: calibrated rectangles whose content must match the calibration run's final state, e.g. the folder
#   pane's message count of the Inbox (bench.py calibrate points --app <id> asks for each region's corners).
#   Changes inside these regions always count as screen changes, however small.
# - verify: after the measured end, End jumps to the end of the list; within 3 s the region list.bottom must show
#   what it showed in the calibration run (the corpus's oldest message). Not waiting time, not a user action.
# - first_visible: the time the first rows appear (list.top), reported as "first messages visible".
# - after_end fail: a significant screen change after the measured end makes the run invalid.
# Point and region names are calibrated per app. Verify every flow against the installed app version during
# calibration (one reference run per app, then look at the reference images); the report publishes these lists.
id: T1
title: {en: "New account: Inbox lists all messages", de: "Neues Konto: Posteingang listet alle Mails"}
description: "Fresh app profile and the seeded server state; from the first continue of the account setup until the Inbox lists all messages and has settled"
start_state: {server: seeded, client: fresh}
timeout_s: 7200
apps:
  parula-jmap:
    prepare: [launch, {wait_settled: {quiet_s: 2.0, timeout_s: 120}}]
    tail_s: 30
    steps:
      - name: find-config
        actions: [{type: "${account.email}"}, {key: Return}, {type: "${account.password}"}, {key: Return}]
      - name: check-login
        actions: [{click: button.continue}]
      - name: open-inbox
        actions: [{click: button.continue}]
        regions: [{region: inbox.count}]
        first_visible: {region: list.top}
        verify: {actions: [{key: End}], regions: [{region: list.bottom}], within_s: 3}
        after_end: fail
  parula-imap:
    prepare: [launch, {wait_settled: {quiet_s: 2.0, timeout_s: 120}}]
    tail_s: 30
    steps:
      - name: find-config
        actions: [{type: "${account.email}"}, {key: Return}, {type: "${account.password}"}, {key: Return}]
      - name: check-login
        actions: [{click: protocol.imap}, {click: button.continue}]
      - name: open-inbox
        actions: [{click: button.continue}]
        regions: [{region: inbox.count}]
        first_visible: {region: list.top}
        verify: {actions: [{key: End}], regions: [{region: list.bottom}], within_s: 3}
        after_end: fail
  thunderbird:
    prepare: [launch, {wait_settled: {quiet_s: 2.0, timeout_s: 120}}]
    tail_s: 30
    steps:
      - name: find-config
        actions: [{type: "${account.name}"}, {key: Tab}, {type: "${account.email}"}, {key: Tab},
                  {type: "${account.password}"}, {key: Return}]
      - name: check-login
        actions: [{click: button.done}]
      - name: finish
        actions: [{click: button.finish}]
      - name: open-inbox
        # Thunderbird shows the new account's start page; a click on its Inbox is its own way to the list.
        actions: [{click: folder.inbox}]
        regions: [{region: inbox.count}]
        first_visible: {region: list.top}
        verify: {actions: [{key: End}], regions: [{region: list.bottom}], within_s: 3}
        after_end: fail
  outlook-classic:
    prepare: [launch, {wait_settled: {quiet_s: 3.0, timeout_s: 180}}]
    tail_s: 30
    opening_screen: {region: pane.center, tolerance: 0.02}
    steps:
      - name: choose-imap
        actions: [{type: "${account.email}"}, {click: link.advanced}, {click: checkbox.manual}, {click: button.connect}]
      - name: enter-password
        actions: [{click: tile.imap}]
      - name: connect
        actions: [{type: "${account.password}"}, {click: button.connect}]
      - name: open-inbox
        actions: [{click: button.done}]
        regions: [{region: inbox.count}]
        first_visible: {region: list.top}
        verify: {actions: [{key: ctrl+End}], regions: [{region: list.bottom}], within_s: 3}
        after_end: fail
  outlook-new:
    prepare: [launch, {wait_settled: {quiet_s: 3.0, timeout_s: 180}}]
    tail_s: 30
    opening_screen: {region: pane.center, tolerance: 0.02}
    steps:
      - name: choose-provider
        actions: [{type: "${account.email}"}, {click: button.continue}]
      - name: imap-form
        actions: [{click: option.imap}, {click: button.continue}]
      - name: connect
        actions: [{type: "${account.password}"}, {click: button.continue}]
      - name: open-inbox
        actions: [{click: button.done}]
        regions: [{region: inbox.count}]
        first_visible: {region: list.top}
        verify: {actions: [{key: ctrl+End}], regions: [{region: list.bottom}], within_s: 3}
        after_end: fail
    # Evidence first (not measured time): keep the account until the server log shows no more fetches from outside
    # the benchmark computer for 3 minutes (at most 2 hours). Then every next run must be a new account setup:
    # remove the account from new Outlook with "remove from all devices" (also from the Microsoft cloud; Microsoft
    # names it as the way to delete the stored credentials), and wait until the log shows no login attempt from
    # outside the benchmark computer for 10 minutes. If the removal fails, the series stops.
    finish_required: true
    finish:
      - {wait_cloud_quiet: {watch: fetches, minutes: 3, timeout_min: 120}}
      - {click: button.settings}
      - {click: nav.accounts}
      - {click: account.manage}
      - {click: button.remove}
      - {click: option.remove_all_devices}
      - {click: button.confirm_remove}
      - {sleep: 5}
      - {wait_cloud_quiet: {watch: logins, minutes: 10, timeout_min: 120}}
