# German text of the sentences a result folder's manifest.json records in English (`deviations`, `instrumentation`),
# for the German method texts (benchlib/method.py, ManifestTexts). One entry per exact English sentence, or per
# session note template with its {placeholders} (benchlib/sessionnotes.py); a sentence without an entry here or in
# the config's `translations.de` keeps the German method text from rendering.

# Linux session (config.linux.example.yaml)
"Test computer: a Linux container (12 vCPUs) with a virtual X server (Xvfb, software rendering); Parula started with --no-sandbox --disable-gpu --disable-dev-shm-usage because the container has no user namespaces, no GPU and a 64 MB /dev/shm.": "Testrechner: ein Linux-Container (12 vCPUs) mit virtuellem X-Server (Xvfb, Software-Rendering); Parula mit --no-sandbox --disable-gpu --disable-dev-shm-usage gestartet, weil der Container keine User-Namespaces, keine GPU und ein /dev/shm von 64 MB hat."
"Thunderbird: start page switched off (mailnews.start_page.enabled = false), so no web page loads during the measurement.": "Thunderbird: Startseite abgeschaltet (mailnews.start_page.enabled = false), damit während der Messung keine Webseite lädt."
"Thunderbird: user.js also switches off pop-ups that would appear during capture: update checks, the default-client question, the telemetry and rights notices, donation and in-app notifications. Install-wide app updates disabled with distribution/policies.json (DisableAppUpdate).": "Thunderbird: Die user.js schaltet außerdem Einblendungen ab, die während der Aufnahme erscheinen würden: Update-Prüfungen, die Frage nach dem Standardprogramm, die Hinweise zu Telemetrie und Rechten, Spendenaufrufe und In-App-Benachrichtigungen. App-Updates der ganzen Installation mit distribution/policies.json abgeschaltet (DisableAppUpdate)."
"Thunderbird: started with Marionette (-marionette -remote-allow-system-access) for the instrumentation.": "Thunderbird: für die Instrumentierung mit Marionette gestartet (-marionette -remote-allow-system-access)."
"Thunderbird: classic scrollbars instead of GTK overlay scrollbars (widget.gtk.overlay-scrollbars.enabled = false), as Parula shows them: an overlay scrollbar fades in and out whenever the window is inspected, which would keep the screen from settling.": "Thunderbird: klassische Bildlaufleisten statt GTK-Overlay-Bildlaufleisten (widget.gtk.overlay-scrollbars.enabled = false), wie Parula sie zeigt: Eine Overlay-Bildlaufleiste blendet sich bei jeder Abfrage des Fensters ein und aus, sodass der Bildschirm nicht zur Ruhe käme."
"Parula: installed from the .deb package; started with --remote-debugging-port for the instrumentation.": "Parula: aus dem .deb-Paket installiert; für die Instrumentierung mit --remote-debugging-port gestartet."
"Parula: its setup pages play a background video, which kept playing as every user sees it (it streams from www.mustang.im during the setup). Where it is visible (the video minus the setup dialog, read from Parula's page ten times a second) was left out of the screen-change detection, during the run and in the analysis of the recording; the setup dialog and everything after the setup counted in full.": "Parula: Seine Einrichtungsseiten spielen ein Hintergrundvideo, das weiterlief, wie jeder Nutzer es sieht (es wird während der Einrichtung von www.mustang.im gestreamt). Wo es sichtbar ist (das Video ohne den Einrichtungsdialog, zehnmal pro Sekunde von Parulas Seite abgefragt), blieb es bei der Erkennung von Bildschirmänderungen außen vor, während des Laufs und bei der Auswertung der Aufnahme; der Einrichtungsdialog und alles nach der Einrichtung zählten voll."
"The apps' own instrumentation (Parula: Chrome DevTools Protocol; Thunderbird: Marionette) finds the setup's buttons and fields, so the driver can click and type there like a user (xdotool). It never gives a time.": "Die eigene Instrumentierung der Apps (Parula: Chrome DevTools Protocol; Thunderbird: Marionette) findet die Schaltflächen und Felder der Einrichtung, damit das Testskript dort wie ein Nutzer klicken und tippen kann (xdotool). Sie liefert nie eine Zeit."
"During Parula's setup its DevTools also report, ten times a second, where the setup's background video is visible (see deviations).": "Während der Einrichtung von Parula melden seine DevTools außerdem zehnmal pro Sekunde, wo das Hintergrundvideo der Einrichtung sichtbar ist (siehe Abweichungen)."
"Every measured step ends at the last screen change in the recording before the moment the instrumentation confirmed the step's result (the next setup page; in the last step: the Inbox lists all messages). The instrumentation is asked only while the screen is still, about once per second.": "Jeder gemessene Schritt endet mit der letzten Bildschirmänderung in der Aufnahme vor dem Moment, in dem die Instrumentierung das Ergebnis des Schritts bestätigte (die nächste Seite der Einrichtung; im letzten Schritt: Der Posteingang listet alle Nachrichten). Die Instrumentierung wird nur gefragt, während der Bildschirm ruht, etwa einmal pro Sekunde."
"After the measured end the instrumentation checks completeness: the folder's message count equals the corpus and the corpus's oldest message is in the list (scrolled to). A run that fails this check counts as a wrong result.": "Nach dem gemessenen Ende prüft die Instrumentierung die Vollständigkeit: Die Nachrichtenzahl des Ordners entspricht den Testdaten, und die älteste Nachricht der Testdaten steht in der Liste (dorthin gescrollt). Ein Lauf, der diese Prüfung nicht besteht, zählt als falsches Ergebnis."
"Client-side network evidence: the TCP connections of each app's processes are read from /proc ten times a second.": "Netzwerk-Belege auf dem Testrechner: Die TCP-Verbindungen der Prozesse jeder App werden zehnmal pro Sekunde aus /proc abgefragt."

# Windows session (windows/config.windows.yaml, benchlib/winsession.py)
"Windows: the apps' windows were placed in the recorded area by the test script (the main window at its size and position, setup dialogs moved to its center at their own size, within 50 ms of appearing).": "Windows: Das Testskript setzte die Fenster der Apps in den aufgenommenen Bereich (das Hauptfenster in seiner Größe und Position, Einrichtungsdialoge in seiner Mitte und in ihrer eigenen Größe, innerhalb von 50 ms nach dem Erscheinen)."
"Parula: started with --remote-debugging-port for the instrumentation.": "Parula: für die Instrumentierung mit --remote-debugging-port gestartet."
"Parula: its update check was off for the session (resources/app-update.yml renamed), like the Linux .deb, which has none": "Parula: seine Update-Prüfung war für die Sitzung aus (resources/app-update.yml umbenannt), wie beim Linux-.deb, das keine hat"
"Parula: the Chrome DevTools Protocol, as on Linux, found the setup's buttons and fields and confirmed the end state (the next setup page, the Inbox listing); it never gives a time. During the setup it also reported, ten times a second, where the setup's background video was visible (see deviations).": "Parula: Das Chrome DevTools Protocol fand wie unter Linux die Schaltflächen und Felder der Einrichtung und bestätigte den Endzustand (die nächste Seite der Einrichtung, die Liste des Posteingangs); es liefert nie eine Zeit. Während der Einrichtung meldete es außerdem zehnmal pro Sekunde, wo das Hintergrundvideo der Einrichtung sichtbar war (siehe Abweichungen)."
"Outlook (classic) and new Outlook: UI Automation (Windows' accessibility interface) found the setup's buttons and fields and confirmed the end state (the next setup page, the Inbox listing); it never gives a time. In new Outlook (Chromium-based) it turns on the accessibility tree for the rest of the run, the same in every run.": "Klassisches und neues Outlook: UI Automation (die Barrierefreiheits-Schnittstelle von Windows) fand die Schaltflächen und Felder der Einrichtung und bestätigte den Endzustand (die nächste Seite der Einrichtung, die Liste des Posteingangs); sie liefert nie eine Zeit. Im neuen Outlook (auf Chromium-Basis) schaltet sie den Barrierefreiheitsbaum für den Rest des Laufs ein, in jedem Lauf gleich."
"Every measured step ends at the last screen change in the recording before the moment the instrumentation confirmed the step's result. The instrumentation is asked only while the screen is still, about once per second.": "Jeder gemessene Schritt endet mit der letzten Bildschirmänderung in der Aufnahme vor dem Moment, in dem die Instrumentierung das Ergebnis des Schritts bestätigte. Die Instrumentierung wird nur gefragt, während der Bildschirm ruht, etwa einmal pro Sekunde."
"After the measured end the instrumentation checks completeness: the folder's message count equals the corpus and the corpus's oldest message is in the list. A run that fails this check counts as a wrong result.": "Nach dem gemessenen Ende prüft die Instrumentierung die Vollständigkeit: Die Nachrichtenzahl des Ordners entspricht den Testdaten, und die älteste Nachricht der Testdaten steht in der Liste. Ein Lauf, der diese Prüfung nicht besteht, zählt als falsches Ergebnis."
"The TCP connection table of each app's processes (IP Helper API, 10 times per second) for the network evidence; UDP (QUIC) remote addresses can't be seen without administrator rights.": "Für die Netzwerk-Belege die TCP-Verbindungstabelle der Prozesse jeder App (IP Helper API, zehnmal pro Sekunde); Zieladressen von UDP (QUIC) sind ohne Administratorrechte nicht sichtbar."

# Session notes (benchlib/sessionnotes.py): one entry per template; {placeholders} keep their recorded values
"Power plan: High performance for the session (was {plan})": "Energiesparplan: Höchstleistung für die Sitzung (vorher {plan})"
"Power plan: unchanged ({plan})": "Energiesparplan: unverändert ({plan})"
"Power plan: unchanged (the active plan couldn't be read)": "Energiesparplan: unverändert (der aktive Plan war nicht lesbar)"
"Windows notifications (toasts) off for the session": "Windows-Benachrichtigungen (Toasts) für die Sitzung aus"
"Sleep and display timeout suspended while the session runs": "Energiesparmodus und Bildschirmabschaltung während der Sitzung ausgesetzt"
"Parula: the computer user's Parula profile was moved aside for the session and moved back afterwards ({count} folders)": "Parula: Das Parula-Profil des Benutzers dieses Computers wurde für die Sitzung beiseitegelegt und danach zurückgelegt ({count} Ordner)"
"Outlook (classic): started with its own profile '{profile}' (/profile), which holds only the test account and is deleted after every run": "Klassisches Outlook: mit einem eigenen Profil „{profile}“ gestartet (/profile), das nur das Testkonto enthält und nach jedem Lauf gelöscht wird"
"Windows: other apps were open during the session: {apps}": "Windows: Während der Sitzung waren andere Apps geöffnet: {apps}"
"Server check: before the session, {sources} named {hosts} for the address's domain, not only the account's server {server}. Each app's setup therefore read the server it found before the password and corrected another one in the app's own manual setup, as a user would (counted as user actions); an app that shows its servers only behind a button had it opened to read them (not counted)": "Serverprüfung: Vor der Sitzung nannte die veröffentlichte Konfiguration der Domain der Adresse ({sources}) {hosts}, nicht nur den Server des Kontos {server}. Die Einrichtung jeder App las deshalb vor dem Passwort den gefundenen Server und korrigierte einen anderen in der eigenen manuellen Einrichtung der App, wie es ein Benutzer täte (als Benutzeraktionen gezählt); bei einer App, die ihre Server nur hinter einer Schaltfläche zeigt, wurde diese zum Lesen geöffnet (nicht gezählt)"
"Server check: before the session, {sources} couldn't be checked for the address's domain. Each app's setup therefore read the server it found before the password and corrected another one in the app's own manual setup, as a user would (counted as user actions); an app that shows its servers only behind a button had it opened to read them (not counted)": "Serverprüfung: Vor der Sitzung ließ sich ein Teil der veröffentlichten Konfiguration der Domain der Adresse nicht prüfen ({sources}). Die Einrichtung jeder App las deshalb vor dem Passwort den gefundenen Server und korrigierte einen anderen in der eigenen manuellen Einrichtung der App, wie es ein Benutzer täte (als Benutzeraktionen gezählt); bei einer App, die ihre Server nur hinter einer Schaltfläche zeigt, wurde diese zum Lesen geöffnet (nicht gezählt)"
