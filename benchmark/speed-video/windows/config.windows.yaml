# Template of the Windows session's config. windows/winbench.py fills in the {{…}} values from the command line
# of run-windows-tests.ps1 and the display it finds, and writes the result to <root>/state/config.yaml.
# The password is never in a file: only in the environment variable BENCH_PASSWORD of the running script.

workdir: "{{root}}/work"
results_dir: "{{root}}"

tools:
  ffmpeg: "{{ffmpeg}}"
  ffprobe: "{{ffprobe}}"

server:
  mode: account
  software: Stalwart
  host: "{{server}}"

account:
  email: "{{email}}"
  display_name: Robin Sample
  password_env: BENCH_PASSWORD

corpus:                              # the same corpus as the Linux config (seeded once by the Parula team)
  profile: inbox-30k
  seed: 20261018
  owner_name: Robin Sample
  owner_address: robin.sample@example.com

display:
  platform: windows
  monitor: 0
  layout: windows-session
  app_region: {x: 0, y: 0, width: 1280, height: 940}
  marker: {cell: 12, position: below, gap: 4}

capture:
  fps: 60
  draw_mouse: false
  live_scale: 4
  tail_s: 0

settle:
  pixel_threshold: 8
  min_changed_pixels: 150
  quiet_s: 1.0
  probe_interval_s: 1.0
  moving_content_hz: 10
  step_timeout_s: 300
  task_timeout_s: 7200
  no_reaction_s: 60
  max_gap_frames: 3

evidence:
  network: true
  poll_hz: 10
  task: T1

runs: {measured: 5, warmup: 1, retries: 2, analyze_after_each: true, min_free_gb: 15}

driver:
  type_delay_ms: 40

windows:
  min_free_gb: 60

apps:
  parula-jmap:
    kind: parula
    name: Parula
    protocol: JMAP
    os: Windows
    launch: ["{{parula_exe}}", --remote-debugging-port=29222]
    probe: {type: cdp, port: 29222, timeout_s: 180}
    start_pages: [initial, email, import-accounts, import-addressbooks]
    window: {timeout_s: 120}
    close: {key: alt+F4, timeout_s: 60}
    process_names: [parula.exe]
    version_from: {command: [powershell, -NoProfile, -Command, "(Get-Item '{{parula_exe}}').VersionInfo.ProductVersion"]}
    install_hint: "run-windows-tests.ps1 installs Parula when it is missing; start it again"
  outlook-classic:
    kind: outlook-classic
    name: Outlook (classic)
    protocol: IMAP
    os: Windows
    microsoft_ui: true
    launch: ["{{outlook_exe}}", /profile, ParulaBench]
    profile_name: ParulaBench
    probe: {type: uia, app: outlook-classic, map: "{{code}}/windows/uia-elements.yaml", timeout_s: 180}
    start_pages: [account-email]
    window: {class: rctrl_renwnd32, timeout_s: 180}
    close: {key: alt+F4, timeout_s: 120}
    process_names: [outlook.exe]
    version_from: {command: [powershell, -NoProfile, -Command, "(Get-Item '{{outlook_exe}}').VersionInfo.ProductVersion"]}
    install_hint: "Install Outlook (classic) from Microsoft 365 (Office), sign in to Office once, then start the script again"
  outlook-new:
    kind: outlook-new
    name: Outlook (new)
    protocol: IMAP
    os: Windows
    microsoft_ui: true
    cloud_sync: true
    launch: [explorer.exe, "shell:AppsFolder\\Microsoft.OutlookForWindows_8wekyb3d8bbwe!Microsoft.OutlookforWindows"]
    probe: {type: uia, app: outlook-new, map: "{{code}}/windows/uia-elements.yaml", timeout_s: 180}
    start_pages: [add-account]
    window: {timeout_s: 180}
    close: {key: alt+F4, timeout_s: 120}
    process_names: [olk.exe]
    keep_after_complete_min: 3
    keep_max_min: 120
    min_gap_after_removal_min: 10
    installed_check: "(Get-AppxPackage Microsoft.OutlookForWindows).Version"
    version_from: {command: [powershell, -NoProfile, -Command, "(Get-AppxPackage Microsoft.OutlookForWindows).Version"]}
    install_hint: "Install the new Outlook for Windows from the Microsoft Store (\"Outlook (new)\"), then start the script again"

sessions:
  windows: {apps: [parula-jmap, outlook-classic, outlook-new]}

comparisons:
  C3: {os: Windows, left: parula-jmap, right: outlook-classic, tasks: [T1], session: windows}
  C4: {os: Windows, left: parula-jmap, right: outlook-new, tasks: [T1], session: windows}

deviations:
  - "Windows: the apps' windows were placed in the recorded area by the test script (the main window at its size and position, setup dialogs moved to its center at their own size, within 50 ms of appearing)."
  - "Parula: started with --remote-debugging-port for the instrumentation."
  - "Parula: its setup pages play a background video, which kept playing as every user sees it (it streams from www.mustang.im during the setup). Where it is visible (the video minus the setup dialog, read from Parula's page ten times a second) was left out of the screen-change detection, during the run and in the analysis of the recording; the setup dialog and everything after the setup counted in full."

procedures:
  - "Every run starts from a fresh app state: Parula without a profile, Outlook (classic) with an empty profile of its own, new Outlook without the test account (removed after every run with \"Remove from all devices\")."
  - "Before every run the test account was checked against the corpus (message count per folder, flags, attachments) and repaired over IMAP if needed (account.json in each run)."
  - "New Outlook: after the measured end the account stayed in new Outlook until its Inbox had listed all messages for 3 minutes (at most 2 hours), then it was removed from all devices; the next new Outlook run started at least 10 minutes after that removal."

instrumentation:
  - "Parula: the Chrome DevTools Protocol, as on Linux, found the setup's buttons and fields and confirmed the end state (the next setup page, the Inbox listing); it never gives a time. During the setup it also reported, ten times a second, where the setup's background video was visible (see deviations)."
  - "Outlook (classic) and new Outlook: UI Automation (Windows' accessibility interface) found the setup's buttons and fields and confirmed the end state (the next setup page, the Inbox listing); it never gives a time. In new Outlook (Chromium-based) it turns on the accessibility tree for the rest of the run, the same in every run."
  - "Every measured step ends at the last screen change in the recording before the moment the instrumentation confirmed the step's result. The instrumentation is asked only while the screen is still, about once per second."
  - "After the measured end the instrumentation checks completeness: the folder's message count equals the corpus and the corpus's oldest message is in the list. A run that fails this check counts as a wrong result."
  - "The TCP connection table of each app's processes (IP Helper API, 10 times per second) for the network evidence; UDP (QUIC) remote addresses can't be seen without administrator rights."
